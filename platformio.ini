[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------
; PARTITION SCHEME: HUGE APP
; Allocates ~3MB for App. 
; SIDE EFFECT: OTA (Wireless Update) is IMPOSSIBLE.
; -----------------------------------------------------------------
board_build.partitions = huge_app.csv

; -----------------------------------------------------------------
; USB SETTINGS (Required for SuperMini)
; -----------------------------------------------------------------
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1

; -----------------------------------------------------------------
; LIBRARIES
; -----------------------------------------------------------------
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    bblanchon/ArduinoJson @ ^7.0.0

; -----------------------------------------------------------------
; UPLOAD SETTINGS
; OTA lines are commented out because Huge App does not support it.
; Connect USB Cable to upload.
; -----------------------------------------------------------------
; upload_protocol = espota
; upload_port = 192.168.1.246