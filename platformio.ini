[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------
; PARTITION SCHEME
; min_spiffs gives approx 1.9MB to APP and 1.9MB to OTA.
; This allows enough space for WiFiClientSecure + NimBLE + OTA.
; -----------------------------------------------------------------
board_build.partitions = min_spiffs.csv

; -----------------------------------------------------------------
; BUILD FLAGS
; -----------------------------------------------------------------
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0 ; Disables debug logs to save flash space

; -----------------------------------------------------------------
; LIBRARIES
; -----------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit BME280 Library @ ^2.2.4    ; <--- ADDED for BME280
    adafruit/Adafruit Unified Sensor @ ^1.1.14   ; <--- ADDED dependency
    adafruit/Adafruit NeoPixel @ ^1.12.0
    h2zero/NimBLE-Arduino @ ^1.4.1 
    jandrassy/TelnetStream @ ^1.3.0

; Removed: paulstoffregen/OneWire
; Removed: milesburton/DallasTemperature

; =================================================================
; OTA CONFIGURATION (Uncomment these lines for Wireless Upload)
; =================================================================
; upload_protocol = espota
; upload_port = esp32-thermo.local