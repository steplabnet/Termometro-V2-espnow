[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------
; PARTITION SCHEME
; Changed from huge_app to min_spiffs.
; REASON: Your script uses LittleFS to save "fixed.json". 
; huge_app usually removes the storage partition. 
; min_spiffs gives ~1.9MB for App (enough for BLE+WiFi) and keeping LittleFS.
; -----------------------------------------------------------------
board_build.partitions = min_spiffs.csv

; -----------------------------------------------------------------
; BUILD FLAGS
; Official DevKit uses external CP2102 USB-to-Serial.
; CDC_ON_BOOT=0 ensures Serial.print goes to the right place.
; -----------------------------------------------------------------
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1

; -----------------------------------------------------------------
; LIBRARIES
; Added Adafruit NeoPixel as required by your script.
; -----------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit NeoPixel @ ^1.12.0