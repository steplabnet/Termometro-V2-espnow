[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------
; PARTITION SCHEME
; min_spiffs allows OTA because it reserves space for two app partitions
; (App0 and App1). Do not use 'huge_app' (it disables OTA).
; -----------------------------------------------------------------
board_build.partitions = min_spiffs.csv

; -----------------------------------------------------------------
; BUILD FLAGS
; -----------------------------------------------------------------
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1

; -----------------------------------------------------------------
; LIBRARIES
; -----------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit NeoPixel @ ^1.12.0

; =================================================================
; OTA CONFIGURATION (Uncomment these lines for Wireless Upload)
; =================================================================

; 1. Tell PlatformIO to use network upload instead of Serial/USB
; upload_protocol = espota

; 2. The IP Address of your ESP32 (Check Serial Monitor for the IP)
; upload_port = 192.168.1.X 

; OR use the Hostname if you set it in code: ArduinoOTA.setHostname("esp32-thermo");
; upload_port = esp32-thermo.local

; 3. (Optional) If you set a password in code: ArduinoOTA.setPassword("admin123");
; upload_flags =
;     --auth=admin123