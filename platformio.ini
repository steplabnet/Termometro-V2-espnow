[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; -----------------------------------------------------------------
; PARTITION SCHEME
; min_spiffs gives approx 1.9MB to APP and 1.9MB to OTA.
; This allows enough space for WiFiClientSecure + NimBLE + OTA.
; -----------------------------------------------------------------
board_build.partitions = min_spiffs.csv

; -----------------------------------------------------------------
; BUILD FLAGS
; -----------------------------------------------------------------
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0 ; Disables debug logs to save flash space

; -----------------------------------------------------------------
; LIBRARIES
; -----------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    h2zero/NimBLE-Arduino @ ^1.4.1 ; REQUIRED: Replaces standard BLE to save ~500KB
    jandrassy/TelnetStream @ ^1.3.0  ; <--- REQUIRED FOR IP MONITOR

; =================================================================
; OTA CONFIGURATION (Uncomment these lines for Wireless Upload)
; =================================================================

; 1. Tell PlatformIO to use network upload instead of Serial/USB
; upload_protocol = espota

; 2. The IP Address of your ESP32 (Check Serial Monitor for the IP)
upload_port = 192.168.1.246 
monitor_port = socket://192.168.1.246:23

; OR use the Hostname if you set it in code:
; upload_port = esp32-thermo.local

; 3. (Optional) If you set a password in code:
; upload_flags =
;     --auth=admin123